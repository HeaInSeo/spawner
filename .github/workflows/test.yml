name: Tests

# No paths-ignore: the workflow always triggers so the required check "Run on
# Ubuntu" always reports a status. Docs-only changes are detected in-job and
# the work is skipped (green) — see
# HeaInSeo/platform-ci-actions/.github/actions/detect-docs-only. (#29)
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: HeaInSeo/platform-ci-actions/.github/actions/detect-docs-only@62c0d29be4f80824cb767bf184512ce9f624d2ff

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify module state
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          go mod tidy
          git diff --exit-code
          test -z "$(git status --porcelain -- go.mod go.sum)"

      - name: Run tests
        if: steps.changes.outputs.docs_only != 'true'
        run: make test

      - name: Run security lint guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make lint-security-check

      - name: Run vulnerability guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make vuln-check

      - name: Generate coverage report
        if: steps.changes.outputs.docs_only != 'true'
        run: make coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.docs_only != 'true'
        with:
          name: spawner-coverage
          path: reports/
