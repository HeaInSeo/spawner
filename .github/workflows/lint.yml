name: Lint

# No paths-ignore: the workflow always triggers so the required check "Lint
# (Run on Ubuntu)" always reports a status. Docs-only changes are detected
# in-job and the work is skipped (green) — see
# HeaInSeo/platform-ci-actions/.github/actions/detect-docs-only. (#29)
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: v1.7.7

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: HeaInSeo/platform-ci-actions/.github/actions/detect-docs-only@62c0d29be4f80824cb767bf184512ce9f624d2ff

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Validate GitHub Actions workflows
        if: steps.changes.outputs.docs_only != 'true'
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

  lint:
    name: Lint (Run on Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: changes
        uses: HeaInSeo/platform-ci-actions/.github/actions/detect-docs-only@62c0d29be4f80824cb767bf184512ce9f624d2ff

      - name: Setup Go
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run lint guardrail
        if: steps.changes.outputs.docs_only != 'true'
        run: make lint
