# Keep in sync with the other copies until then.
name: Detect docs-only change
description: >
  Sets docs_only=true when every changed file is documentation (markdown /
  LICENSE). Lets a required-check job always RUN and report a status (green for
  docs-only), instead of the workflow being skipped by on.*.paths-ignore — which
  leaves the required check permanently "Expected" and blocks docs-only PRs.
  Requires the calling job to checkout with fetch-depth: 0.
outputs:
  docs_only:
    description: "true if the change touches only docs (markdown/LICENSE)"
    value: ${{ steps.detect.outputs.docs_only }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
        else
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
        fi
        # New branch / unknown base (all-zero SHA) → cannot diff → run full checks.
        if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "base commit unavailable — running full checks"
          exit 0
        fi
        # --no-renames: a rename is otherwise reported by its destination only,
        # so renaming a code file to a *.md path would look docs-only and skip
        # every check. With --no-renames both the deleted source and the added
        # destination are listed and classified.
        changed="$(git diff --no-renames --name-only "$base" "$head")"
        if [ -z "$changed" ]; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "no file delta detected — running full checks"
          exit 0
        fi
        # docs_only unless at least one changed file is NOT markdown/LICENSE.
        # ^LICENSE is anchored so LICENSES/foo.go and LICENSE-notes.go stay code;
        # only LICENSE and LICENSE.<ext> count as docs. (.github/*.md is already
        # covered by \.md$.)
        if printf '%s\n' "$changed" | grep -qvE '(\.md$|^LICENSE(\.[^/]*)?$)'; then
          echo "docs_only=false" >> "$GITHUB_OUTPUT"
          echo "non-doc files changed — running checks:"
          printf '%s\n' "$changed" | grep -vE '(\.md$|^LICENSE(\.[^/]*)?$)' | sed 's/^/  /'
        else
          echo "docs_only=true" >> "$GITHUB_OUTPUT"
          echo "docs-only change — skipping work, reporting success"
        fi
